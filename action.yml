name: Setup Doover
description: Install the Doover CLI and the toolchain its app commands need.
branding:
  icon: package
  color: blue

inputs:
  python-version:
    required: false
    default: "3.11"
  node-version:
    description: >
      Installed unconditionally. Deciding per app whether a widget exists would
      mean branching before discovery has run, for a step that costs seconds.
    required: false
    default: "20"
  cli-version:
    description: >
      Pin the CLI, e.g. "doover-cli==1.4.0". Defaults to latest. Worth pinning in
      the workflow rather than per repo, so a bad release is one bump to undo.
    required: false
    default: doover-cli
  ruff-version:
    description: >
      Pin ruff, e.g. "0.16.0". Defaults to latest. Worth pinning once the fleet's
      lint is clean, so a new ruff release cannot change what passes.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the Doover CLI
      shell: bash
      # Via `env` rather than interpolated into the command, so the value cannot
      # break out of the quoting and run something else.
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: uv tool install "$CLI_VERSION"

    # `doover app lint` and `doover app format` shell out to `uv run ruff`, which
    # falls back to PATH when the project itself does not depend on ruff — and most
    # app repos don't, since they lint via pre-commit. Installing it as a tool here
    # means the lint commands work in any repo without every repo having to add a
    # dev dependency for it.
    - name: Install ruff
      shell: bash
      # Branch in bash rather than in an Actions expression: expressions only take
      # single-quoted strings, and passing the input through `env` keeps it out of
      # the command line, where a crafted value would otherwise be shell-injected.
      env:
        RUFF_VERSION: ${{ inputs.ruff-version }}
      run: |
        if [ -n "$RUFF_VERSION" ]; then
          uv tool install "ruff==$RUFF_VERSION"
        else
          uv tool install ruff
        fi

    - name: Report versions
      shell: bash
      run: doover --version || true
